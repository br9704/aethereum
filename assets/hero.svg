<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Aethereum, give your team's AI coding agents a shared brain">
  <title>Aethereum</title>
  <defs>
    <!-- Dark WITH DEPTH, never flat: the field is a gradient, per tokens.css
         (bg-field-top #101014 to bg-field-mid #070708). Flat #000 is what
         made the product read cheap. -->
    <linearGradient id="field" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#101014"/>
      <stop offset="55%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#34c759" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#34c759" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34c759" stop-opacity="0"/>
      <stop offset="45%" stop-color="#34c759" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34c759" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#field)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- PixelMark: the CURRENT mark (apps/web/public/pixel-mark.svg), 8 cells.
       Not the retired bracket wordmark. -->
  <g transform="translate(96 92) scale(0.44)">
    <rect x="0" y="0" width="22.75" height="22.75" rx="3" fill="#34C759"/>
    <rect x="25.75" y="0" width="22.75" height="22.75" rx="3" fill="#34C759"/>
    <rect x="77.25" y="0" width="22.75" height="22.75" rx="3" fill="#34C759"/>
    <rect x="51.5" y="25.75" width="22.75" height="22.75" rx="3" fill="#34C759"/>
    <rect x="0" y="51.5" width="22.75" height="22.75" rx="3" fill="#34C759"/>
    <rect x="51.5" y="51.5" width="22.75" height="22.75" rx="3" fill="#34C759"/>
    <rect x="77.25" y="51.5" width="22.75" height="22.75" rx="3" fill="#34C759"/>
    <rect x="25.75" y="77.25" width="22.75" height="22.75" rx="3" fill="#34C759"/>
  </g>

  <!-- Wordmark in the SANS stack (Geist first), never monospace. -->
  <text x="152" y="128" font-family="Geist, 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="600" fill="#ffffff" letter-spacing="-0.4">Aethereum</text>

  <text x="96" y="212" font-family="Geist, 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="600" fill="#ffffff" letter-spacing="-1.1">Give your team's AI coding agents</text>
  <text x="96" y="268" font-family="Geist, 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="600" fill="#34c759" letter-spacing="-1.1">a shared brain.</text>

  <text x="96" y="312" font-family="Geist, 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" fill="rgba(255,255,255,0.72)">They share contracts, intent, and collision alerts across machines.</text>

  <!-- A command IS genuine code, so monospace is correct here and only here. -->
  <g transform="translate(96 340)">
    <rect x="0" y="0" width="330" height="46" rx="10" fill="rgba(24,24,27,0.55)" stroke="rgba(255,255,255,0.08)"/>
    <text x="18" y="30" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#34c759">$</text>
    <text x="40" y="30" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="rgba(255,255,255,0.92)">npx aethereum init</text>
  </g>

  <text x="450" y="370" font-family="Geist, 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="15" fill="rgba(255,255,255,0.62)">Free · no signup · www.aethereum.dev</text>

  <!-- Live rail: green means live/synced, the one thing the accent is for. -->
  <rect x="96" y="404" width="1008" height="1.5" fill="url(#hair)"/>
</svg>
